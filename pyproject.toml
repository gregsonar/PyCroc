[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycroc"
version = "0.2.0"
description = "TUI GUI-клиент для croc на Textual"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "gregsonar" }]
dependencies = [
    "textual>=8.2",
    "qrcode>=8.0",
    "tomlkit>=0.13",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.11",
    "mypy>=1.13",
    "types-qrcode>=8.0",
]

[project.scripts]
pycroc = "pycroc.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pycroc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pycroc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
