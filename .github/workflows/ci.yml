name: CI

# Тесты и линт на каждый PR в dev/main и на пуш в dev.
# Интеграционные тесты используют заглушку tests/fixtures/fake_croc.py —
# реальный croc и сеть не нужны, поэтому CI гоняется на чистых раннерах.

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Страховка: если тест зависнет в teardown (вне окна pytest-timeout),
    # джоб не должен висеть по полчаса. Обычный прогон — 1-2 минуты, ставим
    # 5 (запас ~2.5x); внутритестовые висы ловит pytest-timeout (60 c) раньше.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev deps
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy --strict)
        run: mypy src --strict

      - name: Tests (pytest)
        run: pytest -q
